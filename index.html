<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ernestine - Stream Movies, TV Shows & Anime</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #07090e;
      color: #e2e8f0;
      overflow-x: hidden;
    }
    .brand-font {
      font-family: 'Orbitron', sans-serif;
    }
    
    .animated-gradient-text {
      background: linear-gradient(-45deg, #0070d1, #a855f7, #ef4444, #3b82f6);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientShift 5s ease infinite;
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .ps-glow {
      box-shadow: 0 0 25px rgba(0, 112, 209, 0.35);
    }
    .ps-card-glow:hover {
      box-shadow: 0 0 30px rgba(0, 112, 209, 0.6), 0 0 10px rgba(229, 9, 20, 0.5);
      border-color: rgba(0, 112, 209, 0.8);
    }
    .glass-nav {
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #07090e; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #0070d1; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <!-- TOP NAVBAR -->
  <header class="fixed top-0 left-0 right-0 z-40 glass-nav px-4 md:px-6 py-4 transition-all duration-300">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-8">
        <a href="#" onclick="fetchCatalog('trending')" class="brand-font text-xl md:text-3xl font-extrabold tracking-wider flex items-center gap-2 animated-gradient-text">
          <i class="fa-solid fa-play text-red-600 text-lg md:text-xl"></i> ERNESTINE
        </a>
        
        <!-- Navigation Links -->
        <nav class="hidden md:flex items-center gap-6 text-sm font-semibold text-gray-300">
          <button onclick="fetchCatalog('trending')" class="hover:text-blue-400 transition">Trending</button>
          <button onclick="fetchCatalog('movie')" class="hover:text-blue-400 transition">Movies</button>
          <button onclick="fetchCatalog('tv')" class="hover:text-blue-400 transition">TV Shows</button>
          <button onclick="fetchCatalog('anime')" class="hover:text-blue-400 transition">Anime</button>
        </nav>
      </div>

      <!-- Search Bar -->
      <div class="flex items-center gap-3">
        <div class="relative">
          <input id="searchInput" oninput="debounceSearch()" type="text" placeholder="Search thousands of titles..." 
            class="bg-slate-900/90 text-sm text-white rounded-full pl-10 pr-4 py-2 w-44 sm:w-64 border border-slate-700 focus:outline-none focus:border-blue-500 transition duration-200">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
        </div>
      </div>

    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="pt-20 pb-16 flex-grow">

    <!-- HERO FEATURED SECTION -->
    <section class="relative w-full h-[55vh] min-h-[420px] max-h-[600px] mb-8 overflow-hidden">
      <div id="heroBg" class="absolute inset-0 bg-cover bg-center transition-all duration-1000 scale-105" style="background-image: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1600&auto=format&fit=crop');"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-[#07090e] via-[#07090e]/60 to-transparent"></div>
      <div class="absolute inset-0 bg-gradient-to-r from-[#07090e] via-[#07090e]/80 to-transparent"></div>

      <div class="relative max-w-7xl mx-auto h-full px-6 flex flex-col justify-end pb-12">
        <div class="inline-flex items-center gap-2 bg-blue-600/30 border border-blue-500/50 rounded-full px-3 py-1 text-xs text-blue-300 font-semibold mb-3 w-fit">
          <i class="fa-solid fa-fire"></i> FEATURED ON ERNESTINE
        </div>
        <h1 id="heroTitle" class="brand-font text-2xl md:text-5xl font-black text-white mb-3 tracking-wide drop-shadow-lg">
          Loading Featured...
        </h1>
        <p id="heroDesc" class="text-gray-300 text-xs md:text-base max-w-xl mb-6 line-clamp-3 leading-relaxed">
          Connecting to catalog...
        </p>

        <div class="flex items-center gap-4">
          <button id="heroPlayBtn" class="ps-glow bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold px-6 py-3 rounded-xl flex items-center gap-2 text-sm md:text-base transition transform hover:scale-105">
            <i class="fa-solid fa-play"></i> Watch Trailer & Info
          </button>
        </div>
      </div>
    </section>

    <!-- CATEGORY FILTER TABS -->
    <div class="max-w-7xl mx-auto px-6 mb-6">
      <div class="flex items-center gap-3 overflow-x-auto pb-2 text-sm no-scrollbar">
        <button onclick="fetchCatalog('trending')" class="cat-btn bg-blue-600 text-white px-5 py-2 rounded-lg font-medium whitespace-nowrap">🔥 Trending All</button>
        <button onclick="fetchCatalog('movie')" class="cat-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-2 rounded-lg font-medium whitespace-nowrap">🎬 Popular Movies</button>
        <button onclick="fetchCatalog('tv')" class="cat-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-2 rounded-lg font-medium whitespace-nowrap">📺 Popular TV Shows</button>
        <button onclick="fetchCatalog('anime')" class="cat-btn bg-slate-800 hover:bg-slate-700 text-slate-300 px-5 py-2 rounded-lg font-medium whitespace-nowrap">⛩️ Popular Anime</button>
      </div>
    </div>

    <!-- CONTENT GRID ROW -->
    <section class="max-w-7xl mx-auto px-6 mb-12">
      <h2 id="sectionTitle" class="text-xl md:text-2xl font-bold text-white mb-6 flex items-center gap-2">
        <span class="w-1.5 h-6 bg-red-600 rounded-full"></span> Ernestine Expanded Library
      </h2>

      <!-- Dynamic Cards Grid -->
      <div id="contentGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-5">
        <!-- JS populates media items here -->
      </div>
    </section>

  </main>

  <!-- MODAL / DETAIL + DIRECT PLAYER POPUP -->
  <div id="detailModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-3 sm:p-4 bg-black/85 backdrop-blur-md overflow-y-auto">
    <div class="relative glass-panel w-full max-w-3xl rounded-2xl overflow-hidden shadow-2xl border border-blue-500/30 my-auto">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute top-3 right-3 z-20 w-9 h-9 bg-slate-900/90 hover:bg-slate-800 text-white rounded-full flex items-center justify-center transition border border-slate-700">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <!-- Video Screen Container -->
      <div class="relative w-full aspect-video bg-black flex items-center justify-center">
        <div id="trailerLoader" class="text-slate-400 text-sm flex flex-col items-center gap-3 text-center px-4">
          <i class="fa-solid fa-spinner animate-spin text-blue-500 text-2xl"></i> 
          <span id="loaderText">Loading Trailer...</span>
        </div>
        <iframe id="modalTrailer" class="w-full h-full hidden" src="" title="Media Stream" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>

      <!-- Server Selector (Visible during full movie play) -->
      <div id="serverBar" class="hidden bg-slate-900/90 border-b border-slate-800 px-5 py-2.5 flex items-center justify-between text-xs">
        <span class="text-slate-400 font-bold flex items-center gap-1.5"><i class="fa-solid fa-server text-blue-400"></i> Stream Provider:</span>
        <div class="flex items-center gap-2">
          <button onclick="switchServer(1)" id="srv1" class="bg-blue-600 text-white font-bold px-3 py-1 rounded transition">Server 1</button>
          <button onclick="switchServer(2)" id="srv2" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-1 rounded transition">Server 2</button>
          <button onclick="switchServer(3)" id="srv3" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-1 rounded transition">Server 3</button>
        </div>
      </div>

      <!-- Details -->
      <div class="p-5 md:p-8">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
          <div>
            <span id="modalType" class="text-[10px] font-extrabold uppercase tracking-wider text-blue-400 bg-blue-950/80 border border-blue-800/80 px-2.5 py-1 rounded">STREAM</span>
            <h3 id="modalTitle" class="text-xl md:text-3xl font-bold text-white mt-1.5">Title</h3>
          </div>
          <div class="flex items-center gap-3 text-xs md:text-sm">
            <span id="modalRating" class="text-yellow-400 font-bold flex items-center gap-1"><i class="fa-solid fa-star"></i> 0.0</span>
            <span id="modalYear" class="text-slate-400">2026</span>
            <span class="bg-slate-800 text-slate-300 text-[10px] md:text-xs px-2 py-0.5 rounded border border-slate-700">4K ULTRA HD</span>
          </div>
        </div>

        <p id="modalDescription" class="text-slate-300 text-xs md:text-sm mb-6 leading-relaxed max-h-28 overflow-y-auto">
          Description
        </p>

        <!-- PLAY NOW BUTTON (DIRECT STREAM PLAYER) -->
        <div class="pt-4 border-t border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
          <button id="mainPlayBtn" onclick="startStream(1)" class="w-full sm:w-auto flex-1 ps-glow bg-gradient-to-r from-red-600 via-indigo-600 to-blue-600 hover:opacity-95 text-white font-black text-base md:text-lg py-3.5 px-8 rounded-xl flex items-center justify-center gap-3 transition transform active:scale-95">
            <i class="fa-solid fa-play text-lg"></i> PLAY NOW
          </button>
          <button onclick="alert('Added to your Ernestine Watchlist!')" class="w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-slate-200 px-6 py-3.5 rounded-xl border border-slate-700 flex items-center justify-center gap-2 text-sm font-semibold">
            <i class="fa-solid fa-plus"></i> Watchlist
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- FOOTER -->
  <footer class="w-full py-6 border-t border-slate-900 bg-[#05070a] text-center">
    <p class="text-xs text-slate-500 font-medium tracking-wide">Ernestine © 2026</p>
  </footer>

  <!-- SCRIPT -->
  <script>
    const TMDB_KEY = "e15be33701bb1a97defdc01b86af2ed9"; 
    const IMAGE_BASE = "https://image.tmdb.org/t/p/w500";
    const BACKDROP_BASE = "https://image.tmdb.org/t/p/original";

    let activeMedia = { id: null, type: 'movie', title: '' };
    let searchDebounce = null;
    let currentServer = 1;

    // Fetch 15 pages in parallel (~300 popular titles per request)
    async function fetchCatalog(category = 'trending') {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = `<div class="col-span-full text-center py-16 text-blue-400 font-semibold"><i class="fa-solid fa-spinner animate-spin text-3xl mb-3"></i><br>Loading Ernestine Library...</div>`;

      let endpoints = [];
      const totalPages = 15;

      for (let page = 1; page <= totalPages; page++) {
        if (category === 'trending') {
          endpoints.push(`https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_KEY}&page=${page}`);
        } else if (category === 'movie') {
          endpoints.push(`https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}&page=${page}`);
        } else if (category === 'tv') {
          endpoints.push(`https://api.themoviedb.org/3/tv/popular?api_key=${TMDB_KEY}&page=${page}`);
        } else if (category === 'anime') {
          endpoints.push(`https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_genres=16&with_original_language=ja&sort_by=popularity.desc&page=${page}`);
        }
      }

      try {
        const responses = await Promise.all(endpoints.map(url => fetch(url)));
        const dataJson = await Promise.all(responses.map(res => res.json()));
        
        let combined = [];
        dataJson.forEach(data => {
          if (data.results) combined.push(...data.results);
        });

        if (combined.length > 0) {
          setupHero(combined[0], category);
          renderApiCatalog(combined, category);
        } else {
          grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No titles available right now.</div>`;
        }
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-500">Failed to load library. Please check your network connection.</div>`;
      }
    }

    // Set Hero Banner
    function setupHero(item, fallbackType) {
      const title = item.title || item.name || "Featured Title";
      const desc = item.overview || "No overview available.";
      const backdrop = item.backdrop_path ? BACKDROP_BASE + item.backdrop_path : 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1600&auto=format&fit=crop';
      
      document.getElementById('heroTitle').innerText = title;
      document.getElementById('heroDesc').innerText = desc;
      document.getElementById('heroBg').style.backgroundImage = `url('${backdrop}')`;
      
      const mediaType = item.media_type || (fallbackType === 'anime' ? 'anime' : (item.first_air_date ? 'tv' : 'movie'));
      document.getElementById('heroPlayBtn').onclick = () => openModal(item.id, mediaType, title, desc, item.vote_average, item.release_date || item.first_air_date);
    }

    // Render Cards Grid
    function renderApiCatalog(items, categoryType) {
      const grid = document.getElementById('contentGrid');
      grid.innerHTML = '';

      items.forEach(item => {
        if (!item.poster_path) return;

        const title = item.title || item.name || "Untitled";
        const type = item.media_type || (categoryType === 'anime' ? 'anime' : (item.first_air_date ? 'tv' : 'movie'));
        const year = (item.release_date || item.first_air_date || '2026').substring(0, 4);
        const rating = item.vote_average ? item.vote_average.toFixed(1) : "N/A";
        const poster = IMAGE_BASE + item.poster_path;

        const card = document.createElement('div');
        card.className = "group relative rounded-xl overflow-hidden bg-slate-900 border border-slate-800 transition duration-300 transform hover:-translate-y-2 cursor-pointer ps-card-glow active:scale-95";
        card.onclick = () => openModal(item.id, type, title, item.overview, rating, year);

        card.innerHTML = `
          <div class="aspect-[2/3] w-full overflow-hidden relative">
            <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" loading="lazy" />
            <div class="absolute top-2 left-2 bg-black/80 backdrop-blur-md text-[10px] font-bold text-blue-400 px-2 py-0.5 rounded border border-blue-500/30 uppercase">
              ${type}
            </div>
            <div class="absolute top-2 right-2 bg-black/80 backdrop-blur-md text-xs font-bold text-yellow-400 px-2 py-0.5 rounded flex items-center gap-1">
              <i class="fa-solid fa-star text-[10px]"></i> ${rating}
            </div>
          </div>
          <div class="p-3">
            <h3 class="text-xs sm:text-sm font-bold text-white truncate group-hover:text-blue-400 transition">${title}</h3>
            <p class="text-[10px] sm:text-xs text-slate-400 mt-1">${year}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Live Search Handler
    function debounceSearch() {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(performSearch, 300);
    }

    async function performSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) {
        fetchCatalog('trending');
        return;
      }

      const grid = document.getElementById('contentGrid');
      grid.innerHTML = `<div class="col-span-full text-center py-12 text-blue-400 font-semibold"><i class="fa-solid fa-spinner animate-spin text-2xl mb-2"></i><br>Searching "${query}"...</div>`;

      try {
        const url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&include_adult=false`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.results && data.results.length > 0) {
          renderApiCatalog(data.results, 'search');
        } else {
          grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">No titles found for "${query}".</div>`;
        }
      } catch (err) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-500">Error executing search.</div>`;
      }
    }

    // Open Modal & Load Official Trailer (Fixed YouTube Embed 153 Issue)
    async function openModal(id, type, title, desc, rating, year) {
      activeMedia = { id, type, title };

      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalType').innerText = type;
      document.getElementById('modalRating').innerHTML = `<i class="fa-solid fa-star"></i> ${rating}`;
      document.getElementById('modalYear').innerText = (year || '2026').substring(0, 4);
      document.getElementById('modalDescription').innerText = desc || "No description available.";
      document.getElementById('serverBar').classList.add('hidden');

      const modal = document.getElementById('detailModal');
      const trailerFrame = document.getElementById('modalTrailer');
      const loader = document.getElementById('trailerLoader');

      trailerFrame.classList.add('hidden');
      trailerFrame.src = "";
      loader.classList.remove('hidden');
      document.getElementById('loaderText').innerText = "Loading Trailer...";
      
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      const mediaEndpoint = (type === 'tv' || type === 'anime') ? 'tv' : 'movie';
      let videoKey = null;

      try {
        const videoUrl = `https://api.themoviedb.org/3/${mediaEndpoint}/${id}/videos?api_key=${TMDB_KEY}&language=en-US`;
        const res = await fetch(videoUrl);
        const data = await res.json();

        if (data.results && data.results.length > 0) {
          const trailer = data.results.find(v => (v.type === 'Trailer' || v.type === 'Teaser') && v.site === 'YouTube') 
                       || data.results.find(v => v.site === 'YouTube');
          if (trailer) videoKey = trailer.key;
        }

        if (!videoKey) {
          const fallbackUrl = `https://api.themoviedb.org/3/${mediaEndpoint}/${id}/videos?api_key=${TMDB_KEY}`;
          const fallbackRes = await fetch(fallbackUrl);
          const fallbackData = await fallbackRes.json();
          if (fallbackData.results && fallbackData.results.length > 0) {
            const trailer = fallbackData.results.find(v => v.site === 'YouTube');
            if (trailer) videoKey = trailer.key;
          }
        }
      } catch (err) {
        console.warn("API Trailer fetch error");
      }

      if (videoKey) {
        // Use youtube-nocookie and standard params to eliminate Error 153
        trailerFrame.src = `https://www.youtube-nocookie.com/embed/${videoKey}?autoplay=1&rel=0&enablejsapi=1`;
        trailerFrame.classList.remove('hidden');
        loader.classList.add('hidden');
      } else {
        const cleanTitle = title.replace(/[^a-zA-Z0-9 ]/g, "");
        const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(cleanTitle + ' official trailer')}`;
        loader.innerHTML = `
          <i class="fa-brands fa-youtube text-red-600 text-4xl md:text-5xl mb-2"></i>
          <span class="text-sm md:text-base text-white font-bold">Watch Trailer on YouTube</span>
          <a href="${searchUrl}" target="_blank" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-xs flex items-center gap-2 transition mt-2">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Trailer
          </a>
        `;
      }
    }

    // Direct Web Player Stream Resolver with Server Switcher
    function startStream(serverNum = 1) {
      if (!activeMedia.id) return;
      currentServer = serverNum;

      const trailerFrame = document.getElementById('modalTrailer');
      const loader = document.getElementById('trailerLoader');
      const serverBar = document.getElementById('serverBar');

      serverBar.classList.remove('hidden');
      updateServerButtons(serverNum);

      trailerFrame.classList.add('hidden');
      loader.classList.remove('hidden');
      loader.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-blue-500 text-3xl mb-2"></i><br><span class="text-sm font-semibold text-white">Connecting to Web Server ${serverNum}...</span>`;

      let streamUrl = "";
      const isMovie = (activeMedia.type === 'movie');

      if (serverNum === 1) {
        streamUrl = isMovie 
          ? `https://vidsrc.xyz/embed/movie/${activeMedia.id}`
          : `https://vidsrc.xyz/embed/tv/${activeMedia.id}/1/1`;
      } else if (serverNum === 2) {
        streamUrl = isMovie 
          ? `https://vidsrc.me/embed/movie?tmdb=${activeMedia.id}`
          : `https://vidsrc.me/embed/tv?tmdb=${activeMedia.id}&season=1&episode=1`;
      } else if (serverNum === 3) {
        streamUrl = isMovie 
          ? `https://vidlink.pro/movie/${activeMedia.id}`
          : `https://vidlink.pro/tv/${activeMedia.id}/1/1`;
      }

      trailerFrame.src = streamUrl;
      trailerFrame.onload = () => {
        loader.classList.add('hidden');
        trailerFrame.classList.remove('hidden');
      };
    }

    function switchServer(num) {
      startStream(num);
    }

    function updateServerButtons(num) {
      [1, 2, 3].forEach(n => {
        const btn = document.getElementById(`srv${n}`);
        if (n === num) {
          btn.className = "bg-blue-600 text-white font-bold px-3 py-1 rounded transition";
        } else {
          btn.className = "bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-3 py-1 rounded transition";
        }
      });
    }

    function closeModal() {
      const modal = document.getElementById('detailModal');
      modal.classList.add('hidden');
      document.getElementById('modalTrailer').src = '';
      document.getElementById('serverBar').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    // Initialize Catalog
    fetchCatalog('trending');
  </script>
</body>
</html>
